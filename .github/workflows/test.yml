# GitHub Actions CI: lint + build.
#
# Триггеры: push в main и любые pull request.
# Действия: проверка eslint + сборка на Node 20 и 22.
#
# Vite использует esbuild (идёт в составе vite) — esbuild качает нативные
# бинарники через postinstall. npm 11+ требует allowScripts — в CI одобряем.
#
# Если нужен деплой dist/ на сервер — добавь отдельный workflow
# (например .github/workflows/deploy.yml) с trigger on push tags,
# rsync через appleboy/ssh-action или scp через actions.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменить запуски для дублирующихся PR-обновлений.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node-${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # esbuild (идёт в составе vite) качает нативные бинарники через postinstall.
      # npm 11+ требует allowScripts — в CI одобряем здесь.
      - name: Approve esbuild postinstall (npm 11+)
        run: npm approve-scripts esbuild --no-fund || true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 7