<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite base</title>
</head>
<body>
  <!--
    Vite entry-point.
    В dev-режиме http://localhost:3000 открывается этот файл,
    Vite инжектит HMR + CSS сам, без участия Bitrix.

    В production-сборке (npm run build) этот index.html попадёт
    в dist/, но Bitrix его НЕ использует — манифест подхватывает
    только main.js / main.css (см. filter в плагине vite-manifest
    внутри vite.config.js).
  -->
  <!-- .app-root — скоуп ресета из src/scss/main.css (для встраивания в Bitrix) -->
  <div id="app" class="app-root"></div>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
